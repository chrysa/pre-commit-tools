---
name: Release

on:
    push:
        branches: [main, master]
        paths-ignore:
            - '**.md'
            - .github/**
    workflow_dispatch:

# The reusable release workflow requests contents: write to push the tag and
# create the GitHub release. The repository default token is read-only, so the
# caller must grant these scopes explicitly or the call fails at startup.
permissions:
    contents: write
    pull-requests: read

jobs:
    call:
        uses: chrysa/github-actions/.github/workflows/release.yml@v1.7.0
        # The called workflow declares a bare `workflow_call:` with no `secrets:`
        # block, so naming RELEASE_TOKEN explicitly is a startup error — inherit.
        secrets: inherit  # pragma: allowlist secret
