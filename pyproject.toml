[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pre_commit_hooks_tools"
version = "0.0.34"
description = "Pre-commit hooks collection for chrysa projects"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/chrysa/pre-commit-tools"

[project.scripts]
adr-gate = "pre_commit_hooks.adr_gate:main"
console-debug-detection = "pre_commit_hooks.console_debug_detection:main"
console-log-detection = "pre_commit_hooks.console_log_detection:main"
console-table-detection = "pre_commit_hooks.console_table_detection:main"
format-dockerfile = "pre_commit_hooks.format_dockerfile:main"
print-detection = "pre_commit_hooks.print_detection:main"
pprint-detection = "pre_commit_hooks.pprint_detection:main"
pylint-report-html = "pre_commit_hooks.pylint_report_html:main"
yaml-sorter = "pre_commit_hooks.yaml_sorter:main"
debugger-detection = "pre_commit_hooks.debugger_detection:main"
json-sorter = "pre_commit_hooks.json_sorter:main"
requirements-sort = "pre_commit_hooks.requirements_sort:main"
ignore-file-sorter = "pre_commit_hooks.ignore_file_sorter:main"
env-file-check = "pre_commit_hooks.env_file_check:main"
logger-detection = "pre_commit_hooks.logger_detection:main"
unreachable-code-detection = "pre_commit_hooks.unreachable_code_detection:main"
dead-code-detection = "pre_commit_hooks.dead_code_detection:main"
ts-unreachable-code-detection = "pre_commit_hooks.ts_unreachable_code_detection:main"
css-duplicate-property-detection = "pre_commit_hooks.css_duplicate_property_detection:main"
css-unused-variable-detection = "pre_commit_hooks.css_unused_variable:main"
css-outside-stylesheet-detection = "pre_commit_hooks.css_outside_stylesheet:main"
react-console-error-detection = "pre_commit_hooks.react_console_error_detection:main"
no-bare-except-detection = "pre_commit_hooks.no_bare_except:main"
no-print-in-migration = "pre_commit_hooks.no_print_in_migration:main"
django-hardcoded-secret-detection = "pre_commit_hooks.django_hardcoded_secret:main"  # pragma: allowlist secret
dockerfile-no-latest-detection = "pre_commit_hooks.dockerfile_no_latest:main"
env-example-sync = "pre_commit_hooks.env_example_sync:main"
no-console-warn = "pre_commit_hooks.no_console_warn:main"
react-direct-dom = "pre_commit_hooks.react_direct_dom:main"
import-no-relative-parent = "pre_commit_hooks.import_no_relative_parent:main"
no-debug-in-settings = "pre_commit_hooks.no_debug_in_settings:main"
django-no-raw-sql = "pre_commit_hooks.django_no_raw_sql:main"
no-sync-in-async = "pre_commit_hooks.no_sync_in_async:main"
fastapi-missing-response-model = "pre_commit_hooks.fastapi_missing_response_model:main"
js-syntax-check = "pre_commit_hooks.js_syntax_check:main"
ts-hardcoded-secret-detection = "pre_commit_hooks.ts_hardcoded_secret:main"  # pragma: allowlist secret
generate-changelog = "pre_commit_hooks.generate_changelog:main"
regression-gate = "pre_commit_hooks.regression_gate:main"
docs-drift-gate = "pre_commit_hooks.docs_drift_gate:main"
helm-lint = "pre_commit_hooks.helm_lint:main"
compose-dev-hot-reload = "pre_commit_hooks.compose_dev_hot_reload:main"
docker-run-host-user = "pre_commit_hooks.docker_run_host_user:main"
no-hardcoded-localhost = "pre_commit_hooks.no_hardcoded_localhost:main"
makefile-check = "pre_commit_hooks.makefile_check:main"
screenshot-capture = "pre_commit_hooks.screenshot_capture:main"
screenshot-publish = "pre_commit_hooks.screenshot_publish:main"
fastapi-missing-links = "pre_commit_hooks.fastapi_missing_links:main"
react-no-async-in-useeffect = "pre_commit_hooks.react_no_async_in_useeffect:main"
dockerfile-multi-stage-check = "pre_commit_hooks.dockerfile_multi_stage_check:main"
dockerfile-healthcheck = "pre_commit_hooks.dockerfile_healthcheck:main"
dockerfile-non-root-user = "pre_commit_hooks.dockerfile_non_root_user:main"
ts-no-any = "pre_commit_hooks.ts_no_any:main"
react-no-inline-styles = "pre_commit_hooks.react_no_inline_styles:main"
python-no-type-ignore = "pre_commit_hooks.python_no_type_ignore:main"
no-external-tool-config = "pre_commit_hooks.no_external_tool_config:main"
no-setup-files = "pre_commit_hooks.no_setup_files:main"
cors-allow-all-detection = "pre_commit_hooks.cors_allow_all:main"
no-unittest-import = "pre_commit_hooks.unittest_import:main"
claude-assets-present = "pre_commit_hooks.claude_assets_present:main"
no-create-all = "pre_commit_hooks.no_create_all:main"
os-environ-direct = "pre_commit_hooks.os_environ_direct:main"
file-too-long = "pre_commit_hooks.file_too_long:main"
function-too-long = "pre_commit_hooks.function_too_long:main"
compose-missing-restart = "pre_commit_hooks.compose_missing_restart:main"
react-useeffect-fetch = "pre_commit_hooks.react_useeffect_fetch:main"
sentry-no-default-pii = "pre_commit_hooks.sentry_no_default_pii:main"
react-token-localstorage = "pre_commit_hooks.react_token_localstorage:main"
pii-in-logs = "pre_commit_hooks.pii_in_logs:main"
django-cookie-security = "pre_commit_hooks.django_cookie_security:main"
fastapi-cookie-insecure = "pre_commit_hooks.fastapi_cookie_insecure:main"
pii-hardcoded = "pre_commit_hooks.pii_hardcoded:main"
dependabot-classified-deps = "pre_commit_hooks.dependabot_classified_deps:main"
claude-skill-frontmatter = "pre_commit_hooks.claude_skill_frontmatter:main"
claude-agent-frontmatter = "pre_commit_hooks.claude_agent_frontmatter:main"
claude-mcp-config = "pre_commit_hooks.claude_mcp_config:main"
python-untyped-raise = "pre_commit_hooks.python_untyped_raise:main"
python-mutable-default = "pre_commit_hooks.python_mutable_default:main"
python-dispatch-ladder = "pre_commit_hooks.python_dispatch_ladder:main"

[project.optional-dependencies]
dead_code = ["vulture>=2.0"]
format_dockerfile = ["dockerfile-parse==2.0.1"]
lint = ["ruff==0.15.21"]  # keep in sync with the ruff-pre-commit rev
pylint_report = ["pylint>=4.0.5", "pylint-report>=2.4.2"]
screenshot = ["requests"]
test = ["pytest", "pytest-cov", "pytest-mock", "ruamel.yaml"]
ts_unreachable_code = [
    "tree-sitter>=0.23,<0.27",
    "tree-sitter-typescript>=0.23,<0.24",
]
typecheck = ["mypy", "types-PyYAML"]
yaml = ["PyYAML==6.0.3"]
# Everything a quality gate needs: every runtime extra (so the whole suite collects)
# plus the build backend. Consumed by CI as `pip install -e ".[dev]"`.
dev = [
    "chrysa-quality-gate @ git+ssh://git@github.com/chrysa/chrysa-lib.git@v0.3.1#subdirectory=packages/python/quality-gate",
    "build",
    "pre_commit_hooks_tools[dead_code,format_dockerfile,lint,screenshot,test,ts_unreachable_code,typecheck,yaml]",
]

[tool.setuptools.packages.find]
exclude = ["tests*", "testing*"]

[tool.coverage.run]
omit = [
    "pre_commit_hooks/pylint_report_html.py",
    "pre_commit_hooks/tools/update_readme.py",
    "pre_commit_hooks/format_dockerfile.py",
    "pre_commit_hooks/tools/pre_commit_tools.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov-fail-under=85"

[tool.ruff]
line-length = 120
# py313 (not py314): ruff format <=0.15.15 strips multi-except parens under py314 — restore when fixed upstream
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "C90",  # mccabe complexity
    "B",    # flake8-bugbear
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "TID",  # flake8-tidy-imports
    "S",    # flake8-bandit (security)
    "FURB", # refurb
    "RUF",  # ruff-specific rules
    "PERF203",
    "PERF401",
    "PLR0402",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR1714",
    "PLR1730",
    "PLR5501",
]
ignore = [
    "E203", # whitespace before ':'
    "S101", # assert used (fine in tests)
    "S603", # subprocess call: check=False
    "S607", # starting a process with a partial executable path
]

[tool.ruff.lint.isort]
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
# Test fixtures use names that look like passwords and call partial-path binaries.
"tests/**" = ["S101", "N802", "S105", "S106", "S603", "S607"]
"pre_commit_hooks/pylint_report_html.py" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.mypy]
cache_dir = "/dev/null"
check_untyped_defs = true
disallow_any_decorated = false
disallow_any_expr = false
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_any_unimported = false
disallow_subclassing_any = false
dump_type_stats = true
follow_imports = "normal"
ignore_missing_imports = true
no_implicit_optional = true
no_implicit_reexport = true
no_incremental = false
no_strict_optional = true
pretty = true
python_version = "3.14"
show_absolute_path = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "*"
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
warn_no_return = true

[tool.pylint.main]
fail-under = 9
jobs = 0
max-args = 10
max-line-length = 120
max-module-lines = 300
min-similarity-lines = 4
output-format = "colorized"
persistent = true
reports = true
score = true
suggestion-mode = true
unsafe-load-any-extension = false
py-version = "3.14"
limit-inference-results = 100
load-plugins = [
    "pylint.extensions.check_elif",
    "pylint.extensions.bad_builtin",
    "pylint.extensions.docparams",
    "pylint.extensions.for_any_all",
    "pylint.extensions.set_membership",
    "pylint.extensions.code_style",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.typing",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.mccabe",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
enable = ["use-symbolic-message-instead", "useless-suppression"]

[tool.pylint.miscellaneous]
notes = ["FIXME", "XXX", "TODO"]

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
min-similarity-lines = 4
